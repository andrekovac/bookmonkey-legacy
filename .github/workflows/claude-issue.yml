name: Claude issue analysis

# Label an issue with "analyse" -> Claude comments feasibility, affected files and risks.
# Label it with "implement"     -> Claude also opens a draft pull request.
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or ANTHROPIC_API_KEY.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  analyse:
    if: github.event.label.name == 'analyse' || github.event.label.name == 'implement'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            Issue #${{ github.event.issue.number }} in ${{ github.repository }}:
            "${{ github.event.issue.title }}"

            Read the issue body and the codebase. Reply on the issue with:
            1. Feasibility: easy, medium or hard, and why.
            2. Affected files with line ranges.
            3. Likely root cause, if the issue describes a defect. Use git history where it helps.
            4. Risks and what to test.
            ${{ github.event.label.name == 'implement' && '5. Then implement the change on a new branch, run npm test, and open a draft pull request that links the issue.' || 'Do not change any files.' }}
          claude_args: |
            --max-turns 30
            --allowedTools Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(npm test:*),Bash(npm install:*),Edit,Write
